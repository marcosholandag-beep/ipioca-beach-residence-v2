<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hero Bold · Ipioca Beach Residence</title>
<link rel="icon" type="image/png" href="assets/logos/mme-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --aqua:#62ADA8; --aqua-claro:#7ED9D2; --teal:#467890;
  --cyan:#21A3C0; --cyan-hover:#1C8CA5;
  --night:#20243C; --night-deep:#171B2D; --creme:#FBF8F4;
  --laranja:#EA8036; --laranja-esc:#D66B22; --dourado:#F5B04A;
  --r-xl:36px; --r-pill:100px;
  --pad:clamp(12px,1.6vw,22px);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--night-deep);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; padding:var(--pad); overflow-x:hidden;
}
a { text-decoration:none; color:inherit; }
img { max-width:100%; display:block; }

/* ---------- NAV ---------- */
.nav {
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  backdrop-filter:blur(18px) saturate(130%); -webkit-backdrop-filter:blur(18px) saturate(130%);
  border-radius:var(--r-pill);
  padding:12px 12px 12px clamp(18px,2.4vw,30px);
  margin-bottom:var(--pad);
  position:relative; z-index:20;
  animation:fadeDown .7s cubic-bezier(.2,.7,.2,1) both;
}
.nav-brand { display:flex; align-items:center; gap:16px; }
.nav-brand img { height:44px; width:auto; }
.nav-brand .sep { width:1px; height:26px; background:rgba(255,255,255,0.22); }
.nav-brand img.mme { height:26px; }
.nav-links { display:flex; gap:6px; list-style:none; }
.nav-links a {
  font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.12em;
  color:rgba(251,248,244,0.78); padding:10px 16px; border-radius:var(--r-pill);
  transition:background .22s ease;
}
.nav-links a:hover { background:rgba(255,255,255,0.10); }
.nav-social { display:flex; gap:8px; }
.nav-social a {
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
  color:var(--creme); transition:transform .22s, background .22s, border-color .22s;
}
.nav-social a svg { width:20px; height:20px; fill:currentColor; }
.nav-social a:hover { transform:translateY(-2px); border-color:transparent; color:#fff; }
.nav-social .wpp:hover { background:#25D366; }
.nav-social .ig:hover { background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF 80%,#515BD4); }

/* ---------- BOTOES ---------- */
.btn {
  display:inline-flex; align-items:center; gap:10px; border-radius:var(--r-pill);
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
  text-transform:uppercase; letter-spacing:0.13em; padding:16px 30px;
  border:none; cursor:pointer; white-space:nowrap;
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s, background .22s;
}
.btn-sol {
  background:linear-gradient(135deg,var(--dourado) 0%,var(--laranja) 100%);
  color:var(--night); box-shadow:0 10px 30px rgba(234,128,54,0.34);
}
.btn-sol:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(234,128,54,0.46); }
.btn .arrow { transition:transform .22s; }
.btn:hover .arrow { transform:translateX(3px); }

/* ---------- HERO (texto atras do sujeito) ---------- */
.hero {
  position:relative; border-radius:var(--r-xl); overflow:hidden; isolation:isolate;
  min-height:clamp(600px,86vh,900px);
  display:flex; flex-direction:column;
  background:url('assets/fotos/ipioca-praia-turquesa.jpg') center/cover no-repeat;
  padding:clamp(16px,2vw,26px);
  animation:cardIn .9s cubic-bezier(.2,.7,.2,1) .08s both;
}
.hero::before {
  content:""; position:absolute; inset:0; z-index:0;
  background:
    linear-gradient(180deg, rgba(23,27,45,.55) 0%, rgba(23,27,45,.08) 26%, rgba(23,27,45,.10) 60%, rgba(23,27,45,.82) 100%);
}

.stage { position:relative; flex:1; z-index:1; }

/* wordmark gigante ATRAS */
.giant {
  position:absolute; left:0; right:0;
  top:50%; transform:translateY(-54%);
  z-index:2;
  text-align:center;
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:clamp(4.5rem,17vw,15rem);
  line-height:0.8;
  letter-spacing:-0.04em;
  text-transform:uppercase;
  background:linear-gradient(180deg,var(--dourado) 0%,var(--laranja) 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 8px 30px rgba(12,16,30,0.35));
  pointer-events:none;
  animation:giantIn 1s cubic-bezier(.2,.7,.2,1) .2s both;
}

/* sujeito (Rodrigo Faro) NA FRENTE do texto */
.subject {
  position:absolute; left:50%; bottom:0;
  transform:translateX(-50%);
  height:96%; width:min(86%,760px);
  z-index:3;
  background:url('assets/fotos/apresentador.png') center bottom/contain no-repeat;
  background-image:image-set(url('assets/fotos/apresentador.webp') 1x);
  filter:contrast(1.05) saturate(1.07) drop-shadow(0 18px 46px rgba(12,16,30,0.55));
  pointer-events:none;
  animation:subjectIn 1.1s cubic-bezier(.2,.7,.2,1) .35s both, floaty 6s ease-in-out 1.4s infinite;
}

/* selo Tripadvisor flutuante */
.hero-trust {
  position:absolute; top:6px; right:6px; z-index:5;
  width:92px; height:92px; background:#fff; border-radius:50%;
  display:grid; place-items:center; padding:11px;
  box-shadow:0 16px 40px rgba(12,20,32,0.34);
  animation:chipIn .6s cubic-bezier(.2,.7,.2,1) .9s both, floaty 6.5s ease-in-out 1.8s infinite;
}
.hero-trust img { width:100%; height:100%; object-fit:contain; }

/* rodape do hero: copy + CTA */
.hero-foot {
  position:relative; z-index:6;
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  flex-wrap:wrap;
  color:var(--creme);
  animation:up .7s cubic-bezier(.2,.7,.2,1) .6s both;
}
.hero-foot .eyebrow {
  display:inline-flex; align-items:center; gap:12px;
  font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em;
  color:var(--aqua-claro); margin-bottom:12px;
}
.hero-foot .eyebrow::before { content:""; width:30px; height:2px; background:var(--aqua-claro); border-radius:2px; }
.hero-foot h1 {
  font-family:'Bricolage Grotesque',sans-serif; font-weight:600;
  font-size:clamp(1.5rem,2.7vw,2.4rem); line-height:1.05; letter-spacing:-0.03em;
  max-width:540px;
}
.hero-foot h1 .it { font-style:italic; color:var(--aqua-claro); }
.hero-cta-wrap { display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
.price small {
  display:block; font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.14em; color:rgba(251,248,244,0.6); text-align:right;
}
.price strong {
  font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px;
  letter-spacing:-0.03em; color:var(--creme);
}

/* ---------- ANIMACOES ---------- */
@keyframes up { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
@keyframes cardIn { from{opacity:0;transform:scale(.985) translateY(16px)} to{opacity:1;transform:none} }
@keyframes chipIn { from{opacity:0;transform:translateY(-10px) scale(.9)} to{opacity:1;transform:none} }
@keyframes giantIn { from{opacity:0;transform:translateY(-40%) scale(1.06)} to{opacity:1;transform:translateY(-54%) scale(1)} }
@keyframes subjectIn { from{opacity:0;transform:translateX(-50%) translateY(34px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
@keyframes floaty { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }

/* o float do selo nao usa translateX(-50%) */
.hero-trust { animation-name:chipIn, bob; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

/* ---------- RESPONSIVO ---------- */
@media (max-width:1080px){ .nav-links{display:none} }
@media (max-width:720px){
  .hero { min-height:640px; }
  .giant { font-size:clamp(3.2rem,20vw,7rem); top:46%; }
  .subject { width:104%; height:70%; }
  .hero-foot { flex-direction:column; align-items:flex-start; }
  .hero-cta-wrap { align-items:flex-start; }
  .price small, .price strong { text-align:left; }
  .hero-trust { width:60px; height:60px; padding:8px; }
  .nav-brand img { height:34px; } .nav-brand img.mme { height:20px; }
  .nav-social a { width:42px; height:42px; }
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
